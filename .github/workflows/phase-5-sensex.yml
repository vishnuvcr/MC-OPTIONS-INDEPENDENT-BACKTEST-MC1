name: Phase 5 - SENSEX backtest

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/model/**"
      - "src/analysis/**"
      - "research/**"
      - ".github/workflows/phase-5-sensex.yml"

jobs:
  sensex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install pandas numpy pyarrow yfinance huggingface_hub tabulate pytest
      - name: Resolve dataset revision
        run: |
          python - <<'PY'
          import json, urllib.request
          u="https://huggingface.co/api/datasets/rissin/nse-options-intraday/revision/main"
          with urllib.request.urlopen(u, timeout=60) as r: x=json.load(r)
          open("data_revision.txt","w").write(x.get("sha","unknown"))
          PY
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-nse-options-${{ hashFiles('data_revision.txt') }}-full
      - name: Download SENSEX option data
        run: |
          mkdir -p data/raw/hf/SENSEX
          python - <<'PY'
          import shutil
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          rev=open("data_revision.txt").read().strip()
          for y in (2024,2025,2026):
              src=hf_hub_download("rissin/nse-options-intraday",filename=f"upstox_intraday/SENSEX/SENSEX_{y}.parquet",repo_type="dataset",revision=rev)
              shutil.copy2(src,Path("data/raw/hf/SENSEX")/f"SENSEX_{y}.parquet")
          PY
      - name: Run locked SENSEX strategy
        run: python -m src.model.run --underlying SENSEX --years 2024,2025,2026
      - name: Summarize
        run: python -m src.analysis.summary --path data/processed/phase2/sensex_trades.csv --output data/processed/phase5/sensex_summary.md
      - uses: actions/upload-artifact@v4
        with:
          name: phase5-sensex
          path: data/processed/phase5/
