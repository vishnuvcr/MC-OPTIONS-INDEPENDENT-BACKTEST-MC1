name: Phase 8 - Methodological revalidation

on:
  push:
    branches: [phase-8-methodological-revalidation]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      years:
        description: "Option years, comma-separated"
        required: true
        default: "2024,2025,2026"

jobs:
  revalidate-nifty:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install pandas numpy pyarrow yfinance huggingface_hub tabulate pytest
      - name: Tests
        run: pytest -q tests/
      - name: Pin dataset revision
        run: echo "8f7739cab3f38abdcbc6332a6d0a83e1341326e3" > data_revision.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-nse-options-8f7739cab3f38abdcbc6332a6d0a83e1341326e3-full
      - name: Download NIFTY raw option data once
        run: |
          mkdir -p data/raw/hf/NIFTY
          python - <<'PY'
          import shutil
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          rev=open("data_revision.txt").read().strip()
          for y in (2024,2025,2026):
              src=hf_hub_download("rissin/nse-options-intraday",filename=f"upstox_intraday/NIFTY/NIFTY_{y}.parquet",repo_type="dataset",revision=rev)
              shutil.copy2(src,Path("data/raw/hf/NIFTY")/f"NIFTY_{y}.parquet")
          PY
      - name: Audit NIFTY raw schema
        run: |
          python - <<'PY'
          import pyarrow.parquet as pq
          from pathlib import Path
          p=Path("data/raw/hf/NIFTY/NIFTY_2024.parquet")
          cols=pq.read_schema(p).names
          expected={"date","timestamp","underlying","expiry","strike","option_type","exercise_style","open","high","low","close","volume","oi","settle_price","source","granularity"}
          assert set(cols)==expected, (cols, sorted(expected-set(cols)), sorted(set(cols)-expected))
          assert "lot_size" not in cols
          print("NIFTY schema OK; lot_size absent as expected")
          PY
      - name: Run full 9-scenario NIFTY raw-option matrix
        env:
          YEARS: ${{ inputs.years || '2024,2025,2026' }}
        run: python -m src.model.matrix --underlying NIFTY --years "$YEARS" --output-dir data/processed/phase8/nifty/scenarios
      - name: Phase 8 NIFTY audit
        run: |
          python -m src.analysis.phase8 --index NIFTY --trades data/processed/phase8/nifty/scenarios/nifty_w756_p5000.csv --output-dir data/processed/phase8/nifty/audit
      - uses: actions/upload-artifact@v4
        with:
          name: phase8-nifty
          path: |
            data/processed/phase8/nifty/
            data_revision.txt

  revalidate-sensex:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install pandas numpy pyarrow yfinance huggingface_hub tabulate pytest
      - name: Tests
        run: pytest -q tests/
      - name: Pin dataset revision
        run: echo "8f7739cab3f38abdcbc6332a6d0a83e1341326e3" > data_revision.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-nse-options-8f7739cab3f38abdcbc6332a6d0a83e1341326e3-full
      - name: Download SENSEX raw option data once
        run: |
          mkdir -p data/raw/hf/SENSEX
          python - <<'PY'
          import shutil
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          rev=open("data_revision.txt").read().strip()
          for y in (2024,2025,2026):
              src=hf_hub_download("rissin/nse-options-intraday",filename=f"upstox_intraday/SENSEX/SENSEX_{y}.parquet",repo_type="dataset",revision=rev)
              shutil.copy2(src,Path("data/raw/hf/SENSEX")/f"SENSEX_{y}.parquet")
          PY
      - name: Audit SENSEX raw schema
        run: |
          python - <<'PY'
          import pyarrow.parquet as pq
          from pathlib import Path
          p=Path("data/raw/hf/SENSEX/SENSEX_2024.parquet")
          cols=pq.read_schema(p).names
          expected={"date","timestamp","underlying","expiry","strike","option_type","exercise_style","open","high","low","close","volume","oi","settle_price","source","granularity"}
          assert set(cols)==expected, (cols, sorted(expected-set(cols)), sorted(set(cols)-expected))
          assert "lot_size" not in cols
          print("SENSEX schema OK; lot_size absent as expected")
          PY
      - name: Run full 9-scenario SENSEX raw-option matrix
        env:
          YEARS: ${{ inputs.years || '2024,2025,2026' }}
        run: python -m src.model.matrix --underlying SENSEX --years "$YEARS" --output-dir data/processed/phase8/sensex/scenarios
      - name: Phase 8 SENSEX audit
        run: |
          python -m src.analysis.phase8 --index SENSEX --trades data/processed/phase8/sensex/scenarios/sensex_w756_p5000.csv --output-dir data/processed/phase8/sensex/audit
      - uses: actions/upload-artifact@v4
        with:
          name: phase8-sensex
          path: |
            data/processed/phase8/sensex/
            data_revision.txt

  cross-index:
    needs: [revalidate-nifty, revalidate-sensex]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: phase8-nifty
          path: data/processed/phase8/nifty
      - uses: actions/download-artifact@v4
        with:
          name: phase8-sensex
          path: data/processed/phase8/sensex
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install pandas numpy pyarrow pytest
      - name: Paired cross-index uncertainty
        run: |
          python -m src.analysis.phase8 --paired-nifty data/processed/phase8/nifty/scenarios/nifty_w756_p5000.csv --paired-sensex data/processed/phase8/sensex/scenarios/sensex_w756_p5000.csv --output-dir data/processed/phase8/cross_index
      - uses: actions/upload-artifact@v4
        with:
          name: phase8-cross-index
          path: data/processed/phase8/cross_index/
