name: Master Candle MC2 Cost Robustness

on:
  workflow_dispatch:
  push:
    branches:
      - side-analysis/master-candle-935-mc2
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  cost-robustness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Download frozen MC1 trade ledgers
        uses: actions/download-artifact@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36523896565
          pattern: master-candle-935-baseline-*
          path: artifacts/mc1
          merge-multiple: false

      - name: Run MC2 cost and slippage sensitivity
        run: python research/side_analyses/master_candle_935/run_mc2_cost_sensitivity.py

      - name: Upload MC2 results
        uses: actions/upload-artifact@v4
        with:
          name: master-candle-935-mc2-cost-robustness
          path: artifacts/mc2
