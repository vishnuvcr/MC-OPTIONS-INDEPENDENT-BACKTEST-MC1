name: Runner smoke test

on:
  issue_comment:
    types: [created]

jobs:
  smoke:
    if: ${{ github.event.issue.pull_request && github.event.issue.number == 10 && github.event.comment.body == '/runner-smoke' && github.event.comment.user.login == 'vishnuvcr' }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - run: python --version
      - run: uname -a
