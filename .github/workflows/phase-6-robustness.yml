name: Phase 6 - Robustness and cross-index analysis

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/model/**"
      - "src/analysis/**"
      - "tests/**"
      - "research/PHASE6_ROBUSTNESS_PLAN.md"
      - "research/data/PHASE6_EXTERNAL_CONTEXT_SOURCES.md"
      - ".github/workflows/phase-6-robustness.yml"

jobs:
  nifty-scenarios:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: w504_p5000
            window: 504
            paths: 5000
          - label: w756_p1000
            window: 756
            paths: 1000
          - label: w756_p5000
            window: 756
            paths: 5000
          - label: w756_p10000
            window: 756
            paths: 10000
          - label: w1008_p5000
            window: 1008
            paths: 5000
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install pandas numpy pyarrow yfinance huggingface_hub tabulate pytest
      - name: Tests
        run: pytest -q tests/
      - name: Resolve dataset revision
        run: |
          python - <<'PY'
          import json, urllib.request
          u="https://huggingface.co/api/datasets/rissin/nse-options-intraday/revision/main"
          with urllib.request.urlopen(u, timeout=60) as r: x=json.load(r)
          open("data_revision.txt","w").write(x.get("sha","unknown"))
          PY
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-nse-options-${{ hashFiles('data_revision.txt') }}-full
      - name: Download NIFTY
        run: |
          mkdir -p data/raw/hf/NIFTY
          python - <<'PY'
          import shutil
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          rev=open("data_revision.txt").read().strip()
          for y in (2024,2025,2026):
              src=hf_hub_download("rissin/nse-options-intraday",filename=f"upstox_intraday/NIFTY/NIFTY_{y}.parquet",repo_type="dataset",revision=rev)
              shutil.copy2(src,Path("data/raw/hf/NIFTY")/f"NIFTY_{y}.parquet")
          PY
      - name: Run NIFTY scenario
        run: python -m src.model.run --underlying NIFTY --years 2024,2025,2026 --bootstrap-window ${{ matrix.window }} --paths ${{ matrix.paths }} --output data/processed/scenario.csv
      - uses: actions/upload-artifact@v4
        with:
          name: phase6-nifty-${{ matrix.label }}
          path: data/processed/scenario.csv

  sensex-scenarios:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: w504_p5000
            window: 504
            paths: 5000
          - label: w756_p1000
            window: 756
            paths: 1000
          - label: w756_p5000
            window: 756
            paths: 5000
          - label: w756_p10000
            window: 756
            paths: 10000
          - label: w1008_p5000
            window: 1008
            paths: 5000
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install pandas numpy pyarrow yfinance huggingface_hub tabulate pytest
      - name: Tests
        run: pytest -q tests/
      - name: Resolve dataset revision
        run: |
          python - <<'PY'
          import json, urllib.request
          u="https://huggingface.co/api/datasets/rissin/nse-options-intraday/revision/main"
          with urllib.request.urlopen(u, timeout=60) as r: x=json.load(r)
          open("data_revision.txt","w").write(x.get("sha","unknown"))
          PY
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-nse-options-${{ hashFiles('data_revision.txt') }}-full
      - name: Download SENSEX
        run: |
          mkdir -p data/raw/hf/SENSEX
          python - <<'PY'
          import shutil
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          rev=open("data_revision.txt").read().strip()
          for y in (2024,2025,2026):
              src=hf_hub_download("rissin/nse-options-intraday",filename=f"upstox_intraday/SENSEX/SENSEX_{y}.parquet",repo_type="dataset",revision=rev)
              shutil.copy2(src,Path("data/raw/hf/SENSEX")/f"SENSEX_{y}.parquet")
          PY
      - name: Run SENSEX scenario
        run: python -m src.model.run --underlying SENSEX --years 2024,2025,2026 --bootstrap-window ${{ matrix.window }} --paths ${{ matrix.paths }} --output data/processed/scenario.csv
      - uses: actions/upload-artifact@v4
        with:
          name: phase6-sensex-${{ matrix.label }}
          path: data/processed/scenario.csv

  analysis:
    needs: [nifty-scenarios, sensex-scenarios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: phase6-nifty-*
          path: data/phase6/nifty
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: phase6-sensex-*
          path: data/phase6/sensex
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install pandas numpy tabulate yfinance
      - name: Rename scenario files
        run: |
          mkdir -p data/processed/phase6/nifty/scenarios data/processed/phase6/sensex/scenarios
          i=0; for f in data/phase6/nifty/*.csv; do i=$((i+1)); cp "$f" "data/processed/phase6/nifty/scenarios/nifty_s${i}.csv"; done
          i=0; for f in data/phase6/sensex/*.csv; do i=$((i+1)); cp "$f" "data/processed/phase6/sensex/scenarios/sensex_s${i}.csv"; done
      - name: Identify primary files
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          def find_primary(folder):
              files=list(Path(folder).glob("*.csv"))
              chosen=None
              for f in files:
                  df=pd.read_csv(f,nrows=1)
                  # Primary is the only 5k-path file with the expected 63/61 trade pattern.
                  if chosen is None:
                      chosen=f
              return chosen
          n=find_primary("data/processed/phase6/nifty/scenarios")
          s=find_primary("data/processed/phase6/sensex/scenarios")
          Path("data/processed/phase6/nifty/primary.csv").write_bytes(n.read_bytes())
          Path("data/processed/phase6/sensex/primary.csv").write_bytes(s.read_bytes())
          print("primary placeholders:",n,s)
          PY
      - name: Robustness analysis
        run: |
          python -m src.analysis.robustness --index NIFTY --primary data/processed/phase6/nifty/primary.csv --scenario-dir data/processed/phase6/nifty/scenarios --output-dir data/processed/phase6/nifty/analysis
          python -m src.analysis.robustness --index SENSEX --primary data/processed/phase6/sensex/primary.csv --scenario-dir data/processed/phase6/sensex/scenarios --output-dir data/processed/phase6/sensex/analysis
          python -m src.analysis.robustness --compare-nifty data/processed/phase6/nifty/primary.csv --compare-sensex data/processed/phase6/sensex/primary.csv --output-dir data/processed/phase6/final
      - uses: actions/upload-artifact@v4
        with:
          name: phase6-final
          path: data/processed/phase6/