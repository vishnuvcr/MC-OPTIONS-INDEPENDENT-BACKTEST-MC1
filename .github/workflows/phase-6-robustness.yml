          python -m src.model.run --underlying SENSEX --years 2024,2025,2026 --bootstrap-window 756 --paths 1000 --output data/processed/phase6/sensex/scenarios/sensex_w756_p1000.csv
          python -m src.model.run --underlying SENSEX --years 2024,2025,2026 --bootstrap-window 756 --paths 5000 --output data/processed/phase6/sensex/scenarios/sensex_w756_p5000.csv
          python -m src.model.run --underlying SENSEX --years 2024,2025,2026 --bootstrap-window 756 --paths 10000 --output data/processed/phase6/sensex/scenarios/sensex_w756_p10000.csv
          python -m src.model.run --underlying SENSEX --years 2024,2025,2026 --bootstrap-window 1008 --paths 5000 --output data/processed/phase6/sensex/scenarios/sensex_w1008_p5000.csv
      - name: Analyze SENSEX
