name: Master Candle 09:35 Research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-spec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate side-analysis files
        run: |
          set -euo pipefail
          test -s research/side_analyses/master_candle_935/PLAN.md
          test -s research/side_analyses/master_candle_935/STRATEGY_SPEC.md
          test -s research/side_analyses/master_candle_935/INITIAL_AUDIT.md
          test -s research/side_analyses/master_candle_935/ERROR_LOG.md
          test -s research/side_analyses/master_candle_935/RESEARCH_LOG.md
          echo "MC0 specification/audit files present."
