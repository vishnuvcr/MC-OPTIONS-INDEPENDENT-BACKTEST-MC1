name: Master Candle 09:35 Research

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'research/side_analyses/master_candle_935/**'
      - '.github/workflows/master-candle-935.yml'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/master-candle-935.yml'
      - 'research/side_analyses/master_candle_935/**'

permissions:
  contents: read

jobs:
  backtest:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, 'MC1')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'push' && 'side-analysis/master-candle-935' || github.sha) }}

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow huggingface_hub

      - name: Run baseline
        run: |
          python research/side_analyses/master_candle_935/run_backtest.py

      - name: Upload baseline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: master-candle-935-baseline
          path: artifacts/master_candle_935
