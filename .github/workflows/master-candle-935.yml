name: Master Candle 09:35 Research

on:
  workflow_dispatch:
  push:
    branches:
      - side-analysis/master-candle-935
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backtest:
    name: baseline-${{ matrix.year }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        year: [2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow huggingface_hub

      - name: Run one-lot baseline
        run: |
          YEAR="${{ matrix.year }}"
          if [ "$YEAR" = "2021" ]; then START="2021-05-27"; else START="$YEAR-01-01"; fi
          if [ "$YEAR" = "2026" ]; then END="2026-08-04"; else END="$YEAR-12-31"; fi
          python research/side_analyses/master_candle_935/run_backtest.py --start "$START" --end "$END" --out-dir "artifacts/master_candle_935/$YEAR"

      - name: Remove local data cache before upload
        run: rm -rf "artifacts/master_candle_935/${{ matrix.year }}/hf_cache"

      - name: Upload one-lot baseline results
        uses: actions/upload-artifact@v4
        with:
          name: master-candle-935-baseline-${{ matrix.year }}
          path: |
            artifacts/master_candle_935/${{ matrix.year }}/summary.json
            artifacts/master_candle_935/${{ matrix.year }}/signals.csv
            artifacts/master_candle_935/${{ matrix.year }}/trades.csv
